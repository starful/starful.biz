{# A8.net banner row (300×250) #}
{% if show_a8_banners and a8_banners %}
<aside class="a8-banners affiliate-box affiliate-box--a8"
       role="complementary"
       aria-label="アフィリエイト広告">
    {% if a8_banners_title %}
    <p class="affiliate-box__title">{{ a8_banners_title }}</p>
    {% endif %}
    <div class="a8-banners__grid">
        {% for banner in a8_banners %}
        <div class="a8-banners__item a8-banners__item--{{ banner.id }}">
            <a class="a8-banners__link"
               href="{{ banner.click_url }}"
               target="_blank"
               rel="nofollow sponsored noopener noreferrer"
               title="{{ banner.label }}{% if banner.desc %} — {{ banner.desc }}{% endif %}"
               data-track="affiliate_a8"
               data-track-label="{{ banner.id }}">
                <img class="a8-banners__img"
                     src="{{ banner.image_url }}"
                     alt="{{ banner.alt }}"
                     width="300"
                     height="250"
                     loading="lazy"
                     decoding="async">
                <span class="a8-banners__label">{{ banner.label }}</span>
            </a>
            <img class="a8-affiliate-pixel" src="{{ banner.pixel_url }}" width="1" height="1" alt="" aria-hidden="true">
        </div>
        {% endfor %}
    </div>
    {% if a8_banners_note %}
    <p class="affiliate-box__note">{{ a8_banners_note }}</p>
    {% endif %}
</aside>
{% endif %}
