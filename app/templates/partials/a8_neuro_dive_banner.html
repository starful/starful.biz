{# A8.net Neuro Dive — 就労移行支援 (300×250) #}
{% if show_a8_neuro_dive and a8_neuro_dive_banner %}
{% set banner = a8_neuro_dive_banner %}
<aside class="a8-neuro-dive affiliate-box affiliate-box--a8"
       role="complementary"
       aria-label="就労移行支援アフィリエイト">
    <p class="affiliate-box__title">{{ a8_neuro_dive_title }}</p>
    <p class="affiliate-box__desc">{{ banner.desc }}</p>
    <a class="a8-neuro-dive__link"
       href="{{ banner.click_url }}"
       target="_blank"
       rel="nofollow sponsored noopener noreferrer"
       title="{{ banner.alt }}"
       data-track="affiliate_a8"
       data-track-label="{{ banner.id }}">
        <img class="a8-neuro-dive__img"
             src="{{ banner.image_url }}"
             alt="{{ banner.alt }}"
             width="300"
             height="250"
             loading="lazy"
             decoding="async">
    </a>
    <img class="a8-affiliate-pixel" src="{{ banner.pixel_url }}" width="1" height="1" alt="" aria-hidden="true">
    <p class="affiliate-box__note">{{ a8_neuro_dive_note }}</p>
</aside>
{% endif %}
